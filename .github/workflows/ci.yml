name: CI

# This tap is a migration pointer, not a cask channel. The only thing left to
# check is that the pointer is well-formed and that no cask or formula has crept
# back in — `brew audit` errors on a token that is both listed in
# tap_migrations.json and still present in the tap that lists it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: The migration is valid JSON and points at juancasanueva/tap
        run: |
          set -euo pipefail
          jq empty tap_migrations.json
          test "$(jq -r '."system-monitor"' tap_migrations.json)" = "juancasanueva/tap"

      - name: The tap ships no package of its own
        run: |
          set -euo pipefail
          test ! -d Casks
          test ! -d Formula
